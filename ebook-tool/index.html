<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de E-book para Amazon</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <!-- Quill.js CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <style>
        #editor {
            height: calc(100% - 42px);
            font-size: 16px;
            border: none !important;
        }

        .ql-toolbar.ql-snow {
            border: none !important;
            border-bottom: 1px solid #e5e7eb !important;
            padding: 8px 12px !important;
        }

        .ql-container.ql-snow {
            border: none !important;
        }

        /* Chapter list styles */
        .chapter-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            cursor: pointer;
            transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 150ms;
        }

        .chapter-item.active {
            background-color: #eff6ff;
            color: #1d4ed8;
        }

        .chapter-item:not(.active):hover {
            background-color: #f9fafb;
        }

        .chapter-title-input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
        }

        .delete-chapter-btn {
            opacity: 0;
            transition: opacity 150ms;
        }

        .chapter-item:hover .delete-chapter-btn {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2">
            <i data-feather="book" class="text-blue-600"></i>
            <h1 class="text-xl font-bold text-gray-800">Criador de E-book</h1>
        </div>
        <div class="flex items-center gap-4">
            <span id="save-status" class="text-sm text-gray-500">Alterações salvas</span>
            <button id="export-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
                <i data-feather="download"></i>
                Exportar EPUB
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-80 bg-white border-r border-gray-200 flex flex-col shrink-0">
            <!-- Metadata Section -->
            <div class="p-4 border-b border-gray-200">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Metadados do Livro</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Título</label>
                        <input type="text" id="book-title" placeholder="Título do E-book" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Autor</label>
                        <input type="text" id="book-author" placeholder="Nome do Autor" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
            </div>

            <!-- Chapters Section -->
            <div class="flex-1 overflow-y-auto p-4">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Capítulos</h2>
                    <button id="add-chapter-btn" class="p-1 hover:bg-gray-100 rounded-full text-blue-600 transition-colors" title="Adicionar Capítulo">
                        <i data-feather="plus-circle" class="w-5 h-5"></i>
                    </button>
                </div>
                <ul id="chapter-list" class="space-y-1">
                    <!-- Chapters will be listed here -->
                </ul>
            </div>
        </aside>

        <!-- Main Content (Editor) -->
        <main class="flex-1 bg-white flex flex-col">
            <div id="editor-container" class="flex-1 overflow-hidden flex flex-col">
                <div id="editor-toolbar" class="border-b border-gray-200">
                    <!-- Quill Toolbar -->
                </div>
                <div id="editor" class="flex-1">
                    <!-- Quill Editor -->
                </div>
            </div>
        </main>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="app.js"></script>
    <script>
        // Initialize Feather Icons
        feather.replace();
    </script>
</body>
</html>
