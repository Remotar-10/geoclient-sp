name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Smart GeoJSON Optimization
        run: |
          echo "📊 Checking GeoJSON size..."
          GEOJSON_FILE="data/municipios-sp.geojson"
          
          if [ ! -f "$GEOJSON_FILE" ]; then
            echo "❌ GeoJSON file not found!"
            exit 1
          fi
          
          # Get file size in bytes
          FILE_SIZE=$(stat -c%s "$GEOJSON_FILE")
          FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
          
          echo "📏 Current size: ${FILE_SIZE_MB} MB (${FILE_SIZE} bytes)"
          
          # Threshold: 5 MB (5242880 bytes)
          THRESHOLD=5242880
          
          if [ $FILE_SIZE -lt $THRESHOLD ]; then
            echo "✅ GeoJSON already optimized (< 5 MB)"
            echo "📊 Size: ${FILE_SIZE_MB} MB"
            echo "🚀 Skipping optimization step"
            
            # Quick validation
            echo "🔍 Validating JSON..."
            if command -v jq &> /dev/null; then
              FEATURES=$(jq '.features | length' "$GEOJSON_FILE" 2>/dev/null || echo "unknown")
              echo "✅ Valid JSON with $FEATURES features"
            else
              echo "✅ File exists and appears valid"
            fi
          else
            echo "⚠️ GeoJSON needs optimization (${FILE_SIZE_MB} MB > 5 MB)"
            echo "🔧 Installing optimization tools..."
            sudo apt-get update -qq && sudo apt-get install -y jq
            npm install -g mapshaper
            
            echo "🗜️ Step 1: Remove unnecessary properties..."
            jq -c '.features |= map({
              type: .type,
              properties: {
                name: (.properties.name // .properties.NAME // .properties.NOME // .properties.NM_MUNI // .properties.NM_MUNICIPIO // .properties.nm_municipio // .properties.NM_MUN // "Unknown")
              },
              geometry: .geometry
            })' "$GEOJSON_FILE" > /tmp/step1.geojson
            
            echo "📏 Step 2: Simplify geometries (reduce vertices)..."
            mapshaper /tmp/step1.geojson \
              -simplify 10% keep-shapes \
              -o /tmp/step2.geojson precision=0.00001
            
            # Final compact output
            jq -c . /tmp/step2.geojson > "$GEOJSON_FILE"
            
            # Calculate reduction
            OPTIMIZED_SIZE=$(stat -c%s "$GEOJSON_FILE")
            OPTIMIZED_MB=$((OPTIMIZED_SIZE / 1024 / 1024))
            REDUCTION=$((100 - (OPTIMIZED_SIZE * 100 / FILE_SIZE)))
            
            echo "✅ Optimization complete!"
            echo "📊 Original: ${FILE_SIZE_MB} MB"
            echo "📊 Optimized: ${OPTIMIZED_MB} MB"
            echo "📉 Reduction: ${REDUCTION}%"
            
            # Verify
            echo "🔍 Validating optimized JSON..."
            FEATURES=$(jq '.features | length' "$GEOJSON_FILE")
            echo "✅ Valid JSON with $FEATURES features"
            
            if [ $FEATURES -lt 600 ]; then
              echo "⚠️ Warning: Only $FEATURES features (expected 645)"
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build artifact
        run: |
          mkdir -p _site
          cp -r * _site/ 2>/dev/null || true
          cp .nojekyll _site/ 2>/dev/null || true
          rm -rf _site/.github 2>/dev/null || true
          
          echo "📦 Artifact contents:"
          du -sh _site
          echo "📄 GeoJSON in artifact:"
          du -sh _site/data/municipios-sp.geojson

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 10
