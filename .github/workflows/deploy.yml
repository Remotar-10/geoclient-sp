name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check if GeoJSON changed
        id: geojson-check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "municipios-sp.geojson"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "⚠️ GeoJSON was modified - optimization will run"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ GeoJSON unchanged - skipping optimization"
          fi

      - name: Smart GeoJSON Optimization
        if: steps.geojson-check.outputs.changed == 'true'
        run: |
          echo "📊 Checking GeoJSON size..."
          GEOJSON_FILE="data/municipios-sp.geojson"
          
          if [ ! -f "$GEOJSON_FILE" ]; then
            echo "❌ GeoJSON file not found!"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "$GEOJSON_FILE")
          FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
          
          echo "📏 Current size: ${FILE_SIZE_MB} MB (${FILE_SIZE} bytes)"
          
          THRESHOLD=5242880
          
          if [ $FILE_SIZE -lt $THRESHOLD ]; then
            echo "✅ GeoJSON already optimized (< 5 MB)"
            echo "📊 Size: ${FILE_SIZE_MB} MB"
            echo "🚀 Skipping optimization step"
            
            if command -v jq &> /dev/null; then
              FEATURES=$(jq '.features | length' "$GEOJSON_FILE" 2>/dev/null || echo "unknown")
              echo "✅ Valid JSON with $FEATURES features"
            else
              echo "✅ File exists and appears valid"
            fi
          else
            echo "⚠️ GeoJSON needs optimization (${FILE_SIZE_MB} MB > 5 MB)"
            echo "🔧 Installing optimization tools..."
            sudo apt-get update -qq && sudo apt-get install -y jq
            npm install -g mapshaper
            
            echo "🗜️ Step 1: Remove unnecessary properties..."
            jq -c '.features |= map({
              type: .type,
              properties: {
                name: (.properties.name // .properties.NAME // .properties.NOME // .properties.NM_MUNI // .properties.NM_MUNICIPIO // .properties.nm_municipio // .properties.NM_MUN // "Unknown")
              },
              geometry: .geometry
            })' "$GEOJSON_FILE" > /tmp/step1.geojson
            
            echo "📏 Step 2: Simplify geometries (reduce vertices)..."
            mapshaper /tmp/step1.geojson \
              -simplify 10% keep-shapes \
              -o /tmp/step2.geojson precision=0.00001
            
            jq -c . /tmp/step2.geojson > "$GEOJSON_FILE"
            
            OPTIMIZED_SIZE=$(stat -c%s "$GEOJSON_FILE")
            OPTIMIZED_MB=$((OPTIMIZED_SIZE / 1024 / 1024))
            REDUCTION=$((100 - (OPTIMIZED_SIZE * 100 / FILE_SIZE)))
            
            echo "✅ Optimization complete!"
            echo "📊 Original: ${FILE_SIZE_MB} MB"
            echo "📊 Optimized: ${OPTIMIZED_MB} MB"
            echo "📉 Reduction: ${REDUCTION}%"
            
            echo "🔍 Validating optimized JSON..."
            FEATURES=$(jq '.features | length' "$GEOJSON_FILE")
            echo "✅ Valid JSON with $FEATURES features"
            
            if [ $FEATURES -lt 600 ]; then
              echo "⚠️ Warning: Only $FEATURES features (expected 645)"
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build optimized artifact
        run: |
          echo "📦 Building optimized artifact..."
          mkdir -p _site
          
          # Copy essential files from root
          echo "📋 Copying core files..."
          cp index.html _site/ 2>/dev/null || true
          cp .nojekyll _site/ 2>/dev/null || true
          cp README.md _site/ 2>/dev/null || true
          
          # ✅ FIX: Copy CSS files from root (style.css)
          echo "🎨 Copying CSS files from root..."
          cp *.css _site/ 2>/dev/null || true
          
          # Copy essential directories
          echo "📁 Copying directories..."
          cp -r js _site/ 2>/dev/null || true
          cp -r css _site/ 2>/dev/null || true
          cp -r components _site/ 2>/dev/null || true
          cp -r data _site/ 2>/dev/null || true
          
          # Exclude heavy documentation from deploy
          echo "🚫 Excluding heavy files:"
          echo "  - HISTORICO-COMPLETO-CONVERSAS.md"
          echo "  - MAPA-*.md"
          echo "  - .github/"
          
          rm -rf _site/.github 2>/dev/null || true
          
          echo "✅ Artifact built successfully!"
          echo "📦 Artifact contents:"
          du -sh _site
          echo "📊 Files in root:"
          ls -lah _site/*.css 2>/dev/null || echo "No CSS files in root"
          echo "📄 GeoJSON in artifact:"
          du -sh _site/data/municipios-sp.geojson 2>/dev/null || echo "GeoJSON not found"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000
          error_count: 10