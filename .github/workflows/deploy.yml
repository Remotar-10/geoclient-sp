name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aggressive GeoJSON Optimization
        run: |
          echo "📊 Original GeoJSON size:"
          ls -lh data/municipios-sp.geojson
          du -h data/municipios-sp.geojson
          
          # Install tools
          echo "🔧 Installing optimization tools..."
          sudo apt-get update -qq && sudo apt-get install -y jq
          npm install -g mapshaper
          
          echo "🗜️ Step 1: Remove unnecessary properties..."
          jq -c '.features |= map({
            type: .type,
            properties: {
              name: (.properties.name // .properties.NAME // .properties.NOME // .properties.NM_MUNI // .properties.NM_MUNICIPIO // .properties.nm_municipio // .properties.NM_MUN // "Unknown")
            },
            geometry: .geometry
          })' data/municipios-sp.geojson > /tmp/step1.geojson
          
          echo "📏 Step 2: Simplify geometries (reduce vertices)..."
          # Simplify to 10% of original vertices, keep topology
          mapshaper /tmp/step1.geojson \
            -simplify 10% keep-shapes \
            -o /tmp/step2.geojson precision=0.00001
          
          echo "🎯 Step 3: Reduce coordinate precision..."
          # 5 decimal places = ~1 meter accuracy (enough for municipal boundaries)
          jq -c '.features[].geometry.coordinates = 
            if .features[].geometry.type == "MultiPolygon" then
              [[[[(.[] * 100000 | round) / 100000]]]]
            else
              [[(.[] * 100000 | round) / 100000]]
            end' /tmp/step2.geojson > /tmp/step3.geojson || cp /tmp/step2.geojson /tmp/step3.geojson
          
          # Final compact output
          jq -c . /tmp/step2.geojson > data/municipios-sp.geojson
          
          echo "✅ Optimized GeoJSON size:"
          ls -lh data/municipios-sp.geojson
          du -h data/municipios-sp.geojson
          
          # Calculate reduction
          ORIGINAL_SIZE=$(stat -c%s data/municipios-sp.geojson 2>/dev/null || echo "26000000")
          OPTIMIZED_SIZE=$(stat -c%s data/municipios-sp.geojson)
          REDUCTION=$((100 - (OPTIMIZED_SIZE * 100 / ORIGINAL_SIZE)))
          echo "📉 Size reduction: ${REDUCTION}%"
          
          # Verify
          echo "🔍 Validating JSON..."
          FEATURES=$(jq '.features | length' data/municipios-sp.geojson)
          echo "✅ Valid JSON with $FEATURES features"
          
          if [ $FEATURES -lt 600 ]; then
            echo "⚠️ Warning: Only $FEATURES features (expected 645)"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build artifact
        run: |
          mkdir -p _site
          cp -r * _site/ 2>/dev/null || true
          cp .nojekyll _site/ 2>/dev/null || true
          rm -rf _site/.github 2>/dev/null || true
          
          echo "📦 Artifact contents:"
          du -sh _site
          echo "📄 GeoJSON in artifact:"
          du -sh _site/data/municipios-sp.geojson

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 10
