<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GeoClient SP v4.2.0 - Sistema completo de mapeamento e gestão de clientes">
    <meta name="author" content="GeoClient Team">
    <title>GeoClient SP v4.2.0 - ES6 Edition</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin="" />
    
    <!-- Application CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/popups.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/reports.css">
    <link rel="stylesheet" href="css/filters.css">
    
    <style>
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.5s ease-out;
        }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }
        .loading-logo { font-size: 64px; margin-bottom: 20px; animation: pulse 2s ease-in-out infinite; }
        .loading-text { color: white; font-size: 24px; font-weight: 600; margin-bottom: 10px; }
        .loading-version { color: rgba(255,255,255,0.8); font-size: 14px; }
        .loading-spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        #app-container { opacity: 0; transition: opacity 0.5s ease-in; }
        #app-container.loaded { opacity: 1; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loading-logo">🗺️</div>
        <div class="loading-text">GeoClient SP</div>
        <div class="loading-version">v4.2.0 - ES6 Edition</div>
        <div class="loading-spinner"></div>
    </div>

    <div id="app-container">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-title">
                    <span class="sidebar-icon">🗺️</span>
                    <span class="sidebar-text">GeoClient SP</span>
                </h1>
                <button id="sidebar-toggle" class="sidebar-toggle" title="Minimizar sidebar">
                    <span>◀</span>
                </button>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-tab active" data-tab="map">
                    <span class="tab-icon">🗺️</span>
                    <span class="tab-text">Mapa</span>
                </button>
                <button class="nav-tab" data-tab="navigation">
                    <span class="tab-icon">🧭</span>
                    <span class="tab-text">Navegação</span>
                </button>
                <button class="nav-tab" data-tab="dashboard">
                    <span class="tab-icon">📊</span>
                    <span class="tab-text">Dashboard</span>
                </button>
                <button class="nav-tab" data-tab="companies">
                    <span class="tab-icon">🏭</span>
                    <span class="tab-text">Empresas</span>
                </button>
                <button class="nav-tab" data-tab="reports">
                    <span class="tab-icon">📄</span>
                    <span class="tab-text">Relatórios</span>
                </button>
            </nav>

            <div class="sidebar-content">
                <!-- Map Tab -->
                <div id="tab-map" class="tab-panel active">
                    <div class="search-box">
                        <input type="text" id="city-search" placeholder="Buscar cidade..." class="search-input">
                    </div>
                    <div class="filter-section">
                        <h3>Filtros Rápidos</h3>
                        <div id="quick-filters" class="quick-filters"></div>
                    </div>
                    <div class="cities-list">
                        <h3>Cidades Marcadas</h3>
                        <div id="marked-cities-list"></div>
                    </div>
                </div>

                <!-- Navigation Tab -->
                <div id="tab-navigation" class="tab-panel">
                    <h2>🧭 Navegação</h2>
                    
                    <!-- Shortcuts -->
                    <div class="nav-section">
                        <h3>🎯 Atalhos Rápidos</h3>
                        <button class="shortcut-btn" id="shortcut-reset">
                            <span>🗺️</span> Resetar Mapa
                        </button>
                        <button class="shortcut-btn" id="shortcut-list">
                            <span>📋</span> Copiar Lista
                        </button>
                    </div>
                    
                    <!-- Recent Cities -->
                    <div class="nav-section">
                        <h3>🌟 Cidades Recentes <span id="recent-count" style="color: #6b7280;"></span></h3>
                        <div id="recent-cities-list"></div>
                    </div>
                    
                    <!-- Regions -->
                    <div class="nav-section">
                        <h3>🗺️ Regiões</h3>
                        <div id="region-buttons"></div>
                    </div>
                    
                    <!-- Layers -->
                    <div class="nav-section">
                        <h3>👁️ Camadas</h3>
                        <div id="layer-toggles"></div>
                    </div>
                </div>

                <!-- Dashboard Tab -->
                <div id="tab-dashboard" class="tab-panel">
                    <h2>📊 Dashboard</h2>
                    <div id="dashboard-stats"></div>
                </div>

                <!-- Companies Tab -->
                <div id="tab-companies" class="tab-panel">
                    <h2>🏭 Empresas</h2>
                    <div id="companies-list"></div>
                </div>

                <!-- Reports Tab -->
                <div id="tab-reports" class="tab-panel">
                    <h2>📄 Relatórios</h2>
                    <div id="reports-templates"></div>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="version-info">
                    <span id="app-version">v4.2.0</span>
                    <span class="version-badge">ES6</span>
                </div>
            </div>
        </aside>

        <main id="main-content" class="main-content">
            <div id="map" class="map-container"></div>
            <div class="map-controls">
                <button id="reset-view" class="map-control-btn" title="Resetar visualização">
                    <span>🎯</span>
                </button>
                <button id="export-data" class="map-control-btn" title="Exportar dados">
                    <span>💾</span>
                </button>
            </div>
        </main>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>

    <script type="module" src="js/test-diagnostics.js"></script>
    <script type="module" src="js/bug-checker.js"></script>

    <script type="module">
        import { initializeApp, getApp, getManagers } from './js/main-es6.js';

        window.addEventListener('geoclient:ready', (event) => {
            const app = event.detail.app;
            
            const loadingScreen = document.getElementById('loading-screen');
            const appContainer = document.getElementById('app-container');
            
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
                appContainer.classList.add('loaded');
                
                setTimeout(() => {
                    console.log('%c🔧 COMANDOS DISPONÍVEIS:', 'color: #8b5cf6; font-size: 14px; font-weight: bold');
                    console.log('%c  • diagnose()   - Testes rápidos do sistema', 'color: #6b7280');
                    console.log('%c  • checkBugs()  - Verificação completa de bugs', 'color: #6b7280');
                    console.log('%c  • help()       - Lista todos os comandos', 'color: #6b7280');
                }, 1000);
            }, 500);

            setupUIListeners(app);
            console.log('🎉 GeoClient SP pronto!', app);
        });

        function setupUIListeners(app) {
            // Sidebar toggle
            const sidebarToggle = document.getElementById('sidebar-toggle');
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', () => {
                    document.getElementById('sidebar').classList.toggle('collapsed');
                });
            }

            // Tab navigation
            const navTabs = document.querySelectorAll('.nav-tab');
            navTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.dataset.tab;
                    navTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    document.querySelectorAll('.tab-panel').forEach(panel => {
                        panel.classList.remove('active');
                    });
                    document.getElementById(`tab-${tabId}`).classList.add('active');
                });
            });

            // Reset view
            const resetBtn = document.getElementById('reset-view');
            if (resetBtn) {
                resetBtn.addEventListener('click', () => app.resetMapView());
            }

            // Export
            const exportBtn = document.getElementById('export-data');
            if (exportBtn) {
                exportBtn.addEventListener('click', () => app.exportJSON());
            }

            // City search
            const searchInput = document.getElementById('city-search');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const results = app.searchCities(e.target.value);
                    console.log('Resultados:', results);
                });
            }
        }
    </script>

    <script nomodule>
        document.getElementById('loading-screen').innerHTML = `
            <div style="text-align: center; color: white; padding: 40px;">
                <h2>⚠️ Navegador Não Suportado</h2>
                <p>Este aplicativo requer ES6 Modules.</p>
                <p>Use Chrome 61+, Firefox 60+, Safari 11+ ou Edge 79+</p>
                <p style="margin-top: 20px;">
                    <a href="index.html" style="color: white; text-decoration: underline;">
                        Usar versão legada (index.html)
                    </a>
                </p>
            </div>
        `;
    </script>

    <style>
        .shortcut-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border: none;
            background: #f9fafb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-size: 0.875rem;
        }
        .shortcut-btn:hover {
            background: #f3f4f6;
            transform: translateX(4px);
        }
        .nav-section {
            margin-bottom: 2rem;
        }
        .nav-section h3 {
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 12px;
        }
    </style>
</body>
</html>
